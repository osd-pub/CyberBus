[workspace]
members = ["crates/*", "examples/cyberbus-cli", "examples/cyberbus-test-client"]
exclude = [".worktrees", ".worktrees/*", "vendor/easytier", "vendor/easytier/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytes = "1.11"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
prost-reflect = "0.16"
protoc-bin-vendored = "3.2"
snow = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.48", features = ["io-util", "time", "rt", "macros", "sync"] }
zeroize = "1.8"
semver = "1.0"

[profile.dev]
debug = 0

[profile.test]
debug = 0
