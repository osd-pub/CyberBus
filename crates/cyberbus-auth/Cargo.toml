[package]
name = "cyberbus-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Native Logto PKCE/OIDC and protected CyberBus credential state"


[features]
default = []
platform-keyring = ["dep:keyring"]

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
jsonwebtoken = "9.3"
libc = "0.2"
oauth2 = { version = "5", default-features = false }
openidconnect = { version = "4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"
curve = { package = "x25519-dalek", version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
ring = "0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
