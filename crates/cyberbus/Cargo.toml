[package]
name = "cyberbus"
version = "0.2.0"
edition = "2021"

[features]
default = []
cloudflared = ["cyberbus-transport/cloudflared"]

[dependencies]
cyberbus-auth = { path = "../cyberbus-auth" }
cyberbus-protocol = { path = "../cyberbus-protocol" }
cyberbus-transport = { path = "../cyberbus-transport", features = ["websocket"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
sha2 = "0.10"
hex = "0.4"
zeroize = "1.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
